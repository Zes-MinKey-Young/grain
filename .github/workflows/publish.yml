name: publish

# 发布到 npm。手动点 "Run workflow"，或者 push 一个 v* 的 tag。
on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            # 打包用的是 bun，不是 node：
            # - @graints/vite-plugin 的 build（`bun build ../compiler/index.ts` 等）
            # - grain-vscode 的 bundle（`bun build ./src/extension.ts`）
            # 没这一步的话 `pnpm packages:build` 直接 `bun: command not found`
            - uses: oven-sh/setup-bun@v2
              with:
                  # 跟本地开发保持一致，免得产物行为悄悄不一样
                  bun-version: 1.3.11

            # 只编译 TS，不需要任何原生模块的构建脚本（keytar / esbuild 之类）
            - run: pnpm install --ignore-scripts --no-frozen-lockfile

            # 产物：packages/runtime/dist 与 packages/vite-plugin/dist
            - run: pnpm packages:build

            - run: npm publish --access public
              working-directory: packages/runtime
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - run: npm publish --access public
              working-directory: packages/vite-plugin
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - run: npm publish --access public
              working-directory: packages/create-grain
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
